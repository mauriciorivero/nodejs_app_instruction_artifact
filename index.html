<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Construyendo Persona API</title>
<meta name="description" content="Presentación interactiva paso a paso para construir una API REST de Persona con Node.js, Express y MySQL.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!--
  Presentación interactiva: "Construyendo Persona API"
  Funciona sin internet: abre este archivo directamente en el navegador.
  Navegación: flechas ← →, barra espaciadora, Inicio/Fin, tecla "i" para el índice.
-->
<canvas id="scene-back" class="scene" aria-hidden="true"></canvas>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">persona-api</span>
      <span class="crumbs" id="crumbs"></span>
    </div>
    <div class="top-actions">
      <span class="counter" id="counter" aria-live="polite"></span>
      <button class="btn" id="btn-index" type="button" aria-haspopup="dialog" aria-controls="index">
        <span class="btn-icon" id="icon-index"></span><span class="btn-label">Índice</span>
      </button>
      <button class="btn" id="btn-theme" type="button"></button>
    </div>
  </header>

  <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>

  <div class="pipeline-wrap">
    <p class="pipeline-label">Recorrido de<br>una petición</p>
    <div class="pipeline" id="pipeline" role="img" aria-label="Capas que recorre una petición: Cliente, Express, routes, controllers, services, models y MySQL, con utils y middleware como capas transversales"></div>
  </div>

  <main class="stage" id="stage"></main>

  <footer class="narrator" id="narrator">
    <div class="bit-slot" id="bit-slot" data-bit-slot>
      <button class="bit-hit" id="bit-hit" type="button" aria-label="Saludar a Bit"></button>
      <span class="bit-fallback" aria-hidden="true">
        <svg viewBox="0 0 120 150"><rect x="56" y="6" width="8" height="18" rx="3" class="fb-shade"/><circle cx="60" cy="10" r="8" class="fb-accent"/><rect x="8" y="26" width="104" height="78" rx="28" class="fb-body"/><rect x="21" y="39" width="78" height="52" rx="16" class="fb-screen"/><rect x="39" y="53" width="12" height="17" rx="6" class="fb-eye"/><rect x="69" y="53" width="12" height="17" rx="6" class="fb-eye"/><rect x="30" y="110" width="60" height="36" rx="14" class="fb-body"/></svg>
      </span>
    </div>
    <div class="bubble" id="bubble" aria-live="polite">
      <p class="bubble-title" id="bubble-title"></p>
      <p class="bubble-text" id="bubble-text"></p>
    </div>
    <nav class="nav" aria-label="Navegación de diapositivas">
      <button class="btn btn--nav" id="btn-prev" type="button" aria-label="Diapositiva anterior">
        <span class="btn-icon" id="icon-prev"></span><span class="btn-label">Anterior</span>
      </button>
      <button class="btn btn--nav btn--primary" id="btn-next" type="button" aria-label="Diapositiva siguiente">
        <span class="btn-label">Siguiente</span><span class="btn-icon" id="icon-next"></span>
      </button>
    </nav>
  </footer>
</div>

<canvas id="scene-front" class="scene" aria-hidden="true"></canvas>

<div class="index-overlay" id="index" hidden>
  <div class="index-panel" role="dialog" aria-modal="true" aria-labelledby="index-title">
    <div class="index-head">
      <h2 id="index-title">Índice de pasos</h2>
      <button class="btn btn--icon" id="btn-close-index" type="button" aria-label="Cerrar índice">
        <span class="btn-icon" id="icon-close"></span>
      </button>
    </div>
    <div class="index-body" id="index-body"></div>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="js/code-files.js"></script>
<script src="js/slides.js"></script>
<script src="js/scene.js"></script>
<script src="js/app.js"></script>
</body>
</html>
